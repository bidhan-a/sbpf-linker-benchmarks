[package]
name = "pointer-table"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[target.'cfg(target_arch = "bpf")'.dependencies]
solana-compiler-builtins = { git = "https://github.com/blueshift-gg/solana-compiler-builtins", version = "0.1.0" }

[target.'cfg(not(any(target_arch = "bpf", target_os = "solana")))'.dependencies]
harness = { workspace = true }

